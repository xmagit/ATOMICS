[workspace]
resolver = "3"
members = ["crates/atomics-core", "crates/atomics-ui", "crates/atomics-web", "crates/atomics"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.3"
license = "MIT"
repository = "https://github.com/xmagit/ATOMICS"
description = "Review-first workspace for coding agents"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

# The browser bundle (crates/atomics-web, built by trunk): small over fast, as the P0 spike measured it.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
panic = "abort"
