[workspace]
resolver = "3"
members = ["crates/cox-core", "crates/cox"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/xmagit/IMACS"
description = "Review-first workspace for coding agents"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
