[package]
name = "atomics-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[features]
default = ["native"]
native = ["dep:dirs", "dep:glob", "dep:ureq", "time/std", "dep:tempfile", "dep:libc"]
test-support = []

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
dirs = { version = "7.0.0", optional = true }
# Warm-folder patterns ([worktrees] warm) are matched on the host only.
glob = { version = "0.3.4", optional = true }
libc = { version = "0.2.191", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
# The end-to-end channel between a host and a browser (noise.rs): pure-Rust primitives that build
# for wasm32, with no std feature (snow's would pull in ring, which needs a C toolchain there).
snow = { version = "0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
curve25519-dalek = { version = "4.1.3", default-features = false }
getrandom = "0.3.4"
zeroize = "1.9.1"
serde_json = "1.0.154"
# The remote plan digest, and the pairing code (noise.rs); snow hashes with it as well.
sha2 = "0.10.9"
shlex = "2.0.1"
similar = "3.2.1"
toml = "1.1.8"
# Proposed config changes keep the user's comments and layout.
toml_edit = "0.25.17"
uuid = { version = "1.29.0", default-features = false }
tempfile = { version = "3.27.0", optional = true }
# Browser usage parsing needs no clock; keep time's SystemTime helpers native.
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"], optional = true }

# In a browser, randomness is crypto.getRandomValues.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3.27.0"
