[package]
name = "atomics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
alacritty_terminal = "0.26.0"
# alacritty_terminal's poller types, for the PTY wrapper that counts what the PTY has taken.
polling = "3.11.0"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
atomics-core = { version = "0.1.0", path = "../atomics-core" }
atomics-ui = { version = "0.1.0", path = "../atomics-ui" }
# `atomics --connect`: the browser client's driver, backend and views, run natively against a host.
atomics-web = { version = "0.1.0", path = "../atomics-web" }
libc = "0.2.191"
cpal = "0.18.2"
# Keep both Linux window systems and embedded fallback fonts in desktop builds.
eframe = { version = "0.37.0", features = ["wayland", "x11", "default_fonts"] }
egui = "0.37"
# Finds theme fonts by family name; eframe already builds it with these features.
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
notify = "8.2.1"
png = "0.18.1"
rfd = "0.17.2"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.29.0", features = ["v4"] }
# The ticket layer's MCP client speaks streamable HTTP too.
# Browser sign-in for those servers (MCP authorization spec): S256 PKCE, URLs and base64url.
ring = "0.17.14"
# The protocol server's loopback WebSocket, and the rendezvous's outbound one; blocking, on their own
# threads. The rendezvous does its own TLS with the rustls ureq already builds (same features).
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
rustls = { version = "0.23.46", default-features = false, features = ["logging", "std", "tls12", "ring"] }
webpki-roots = "1.0.11"
zeroize = "1.9.1"
# The pairing link's QR code in "Pair a device"; no dependencies of its own.
qrcodegen = "1.8.0"
url = "2.5.8"
base64 = "0.22.1"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
# HTTP dependencies log query strings at trace level. This credential-holding binary must
# never format those records, even if a runtime enables verbose logging.
log = { version = "0.4.34", features = ["max_level_info"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-onig"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
tempfile = "3.27.0"
# VM releases are streamed to disk; mapping avoids a multi-GiB verification allocation.
memmap2 = "0.9.10"
zstd = "0.13"
# Azure DevOps pull request diffs are built from the two sides' blobs; atomics-core uses it already.
similar = "3.2.1"

# macOS delivers atomics:// links as an Apple event.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
mach2 = "0.6.0"

[dev-dependencies]
atomics-core = { path = "../atomics-core", features = ["test-support"] }
atomics-ui = { path = "../atomics-ui", features = ["test-support"] }
toml = "1.1.8"
