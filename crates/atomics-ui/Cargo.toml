[package]
name = "atomics-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The ATOMICS UI's view of a host: the Backend trait and the data it returns"

# The web UI crate. It must build for wasm32 and carry no desktop-only crate: see tests/dependencies.rs.
[dependencies]
serde_json = "1.0.154"
atomics-core = { version = "0.1.0", path = "../atomics-core", default-features = false }
# egui's own fonts stay behind a theme's for missing glyphs, so the web UI bundles them.
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }

qrcodegen = "1.8.0"
# Unicode format controls are not covered by char::is_control. Pure Rust, including on wasm32.
unicode-general-category = "1.1.0"

[features]
# Records where some widgets were drawn, for the desktop's layout and interaction tests (its dev-dependency
# turns it on).
test-support = []
