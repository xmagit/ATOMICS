[package]
name = "imacs-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[features]
default = ["native"]
native = ["dep:base64", "dep:dirs", "dep:ureq", "time/std", "dep:tempfile", "dep:libc"]

[dependencies]
anyhow = "1.0.104"
base64 = { version = "0.22.1", optional = true }
dirs = { version = "7.0.0", optional = true }
libc = { version = "0.2.191", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shlex = "2.0.1"
similar = "3.2.1"
toml = "1.1.8"
tempfile = { version = "3.27.0", optional = true }
# Browser usage parsing needs no clock; keep time's SystemTime helpers native.
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3.27.0"
