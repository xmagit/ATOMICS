[package]
name = "imacs-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shlex = "2.0.1"
similar = "3.2.1"
toml = "1.1.8"
time = { version = "0.3.55", features = ["parsing"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
