[package]
name = "atomics-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The ATOMICS UI in a browser: a client of a remote host over atomics.v1"
publish = false

# Everything but the browser glue (src/web.rs) builds natively too, so the boot rules, the channel and the
# remote Backend are tested without a browser. The bundle is built with trunk (Trunk.toml, scripts/build-web.sh).
[dependencies]
atomics-core = { version = "0.1.0", path = "../atomics-core", default-features = false }
atomics-ui = { version = "0.1.0", path = "../atomics-ui" }
egui = { version = "0.37", default-features = false }
getrandom = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The bundle manifest's wasm digest (the native `atomics-web manifest`).
sha2 = "0.10.9"
zeroize = "1.9.1"

# The browser: eframe's web runner with glow (WebGL2 only; about 750 KB less gzipped than wgpu, P0 spike).
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
js-sys = "0.3.106"
# The ATOMICS icon, which the top bar shows as the desktop's does.
png = "0.18.1"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
    "BinaryType",
    "CloseEvent",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "MessageEvent",
    "Navigator",
    "Performance",
    "WebSocket",
    "Window",
    "console",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3.27.0"
# The headless-browser test's broker (tests/browser.rs).
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
