[package]
name = "imacs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
imacs-core = { version = "0.1.0", path = "../imacs-core" }
libc = "0.2.191"
cpal = "0.18.2"
eframe = "0.37.0"
egui = "0.37"
notify-debouncer-mini = "0.7.0"
png = "0.18.1"
rfd = "0.17.2"
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-onig"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
