name: Web bundle

# The ATOMICS web client as a release artifact (docs/daemon.md, "The browser client and its embedding"):
# Branch dispatch builds the web artifact. Version tags also sign and publish it with the desktop and VM builds.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      vm_image:
        description: Also build the VM image, to prove its job without cutting a tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tagged commit and its CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo '::error::The tagged commit must be an ancestor of origin/main before releasing.'
            exit 1
          fi
          # Inspect the latest run, so an older success cannot hide a failed or unfinished run.
          if ! ci_result=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$commit" -f per_page=1 \
            --jq '.workflow_runs[0] | [.head_sha, .head_branch, .event, .status, .conclusion] | @tsv'); then
            echo '::error::Unable to read CI for the tagged commit; refusing to release.'
            exit 1
          fi
          if [ "$ci_result" != "$commit"$'\tmain\tpush\tcompleted\tsuccess' ]; then
            echo '::error::The tagged commit must have a completed, successful CI push run on main. Wait for CI or fix it before releasing.'
            exit 1
          fi

  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: 'false'
      - name: Install trunk and wasm-bindgen
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2
        with:
          # wasm-bindgen must equal the crate version in Cargo.lock.
          tool: trunk@0.21.14,wasm-bindgen@0.2.129
      - name: Build
        env:
          BUILT_FROM: ${{ github.sha }}
          JOBS: '2'
        run: scripts/build-web.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: atomics-web
          retention-days: 14
          path: |
            target/web/atomics-web-*.tar.gz
            target/web/atomics-web-*.tar.gz.sha256
          if-no-files-found: error

  desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    outputs:
      linux-id: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && steps.upload.outputs.artifact-id || '' }}
      macos-id: ${{ matrix.target == 'aarch64-apple-darwin' && steps.upload.outputs.artifact-id || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check the release version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo '::error::The version tag must match workspace.package.version in Cargo.toml.'
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # A build carries its trust anchors from here on, so one without both could never be recovered from a lost key.
      - name: Require both release keys in this commit
        run: |
          for key in assets/release-signing-key.pub assets/release-signing-key-offline.pub; do
            if [ ! -f "$key" ]; then
              echo "::error::$key is missing; docs/releasing.md says how to make the release keys."
              exit 1
            fi
          done
          if cmp -s assets/release-signing-key.pub assets/release-signing-key-offline.pub; then
            echo '::error::The two release keys are the same key.'
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: 'false'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - name: Build and pack the desktop
        id: pack
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          out="$GITHUB_WORKSPACE/target/desktop"
          archive="atomics-$VERSION-$TARGET.tar.gz"
          mkdir -p "$out"
          if [ "$RUNNER_OS" = Linux ]; then
            cargo build --release --locked -p atomics --target "$TARGET"
            tar -czf "$out/$archive" -C "target/$TARGET/release" atomics
          else
            CARGO_BUILD_TARGET="$TARGET" scripts/macos-app.sh "$out"
            tar -czf "$out/$archive" -C "$out" ATOMICS.app
          fi
          # Only a debug build can name another release feed or key: a release must not hold that path at all.
          program="target/$TARGET/release/atomics"
          if grep -Eq 'ATOMICS_TEST_(RELEASE_FEED|VM_RELEASE_BASE|RELEASE_KEY)' "$program"; then
            echo '::error::This release build holds the test release feed.'
            exit 1
          fi
          (cd "$out" && shasum -a 256 "$archive" > "$archive.sha256")
          echo "archive=$out/$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: atomics-unsigned-${{ matrix.target }}
          retention-days: 14
          path: |
            target/desktop/atomics-*.tar.gz
            target/desktop/atomics-*.tar.gz.sha256
          if-no-files-found: error

  vm-image:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.vm_image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        flavor: [standard, hardened]
    outputs:
      standard-id: ${{ matrix.flavor == 'standard' && steps.upload.outputs.artifact-id || '' }}
      hardened-id: ${{ matrix.flavor == 'hardened' && steps.upload.outputs.artifact-id || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Nix and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nix-bin zstd
          sudo mkdir -p /etc/nix
          echo 'experimental-features = nix-command flakes' | sudo tee -a /etc/nix/nix.conf
          # systemd-repart builds the image in a user namespace, which Ubuntu 24.04 refuses by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo systemctl enable --now nix-daemon.socket
          # Ubuntu's package keeps the socket's folder to the nix-users group, which this login joined too late to count.
          sudo chmod a+rx /nix/var/nix/daemon-socket
          sudo chmod a+rw /nix/var/nix/daemon-socket/socket
      - name: Build the generic image and bundle template
        run: bash scripts/release-vm-image.sh target/vm-release "${{ matrix.flavor }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: atomics-unsigned-vm-${{ matrix.flavor }}
          retention-days: 14
          path: target/vm-release/*
          if-no-files-found: error

  # The only job that sees the signing key, and only once a person has approved it. Everything a build runs runs in the
  # jobs above, on other machines, so nothing in the dependency tree comes near the key: no build, no cargo, no cache, and
  # the signing script from the tagged commit. What it signs is data to it. Each action is pinned to a commit, since an
  # action that moved could otherwise leave something behind for the step that holds the key.
  sign:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Sign the release files
    needs: [preflight, bundle, desktop, vm-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            assets
      # Bind each destination to its build's upload ID. An absent ID must fail the download.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bundle.outputs.artifact-id || 'missing' }}
          path: ${{ runner.temp }}/unsigned/atomics-web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.desktop.outputs.linux-id || 'missing' }}
          path: ${{ runner.temp }}/unsigned/atomics-unsigned-x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.desktop.outputs.macos-id || 'missing' }}
          path: ${{ runner.temp }}/unsigned/atomics-unsigned-aarch64-apple-darwin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.vm-image.outputs.standard-id || 'missing' }}
          path: ${{ runner.temp }}/unsigned/atomics-unsigned-vm-standard
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.vm-image.outputs.hardened-id || 'missing' }}
          path: ${{ runner.temp }}/unsigned/atomics-unsigned-vm-hardened
      - name: Check what the builds made
        run: |
          python3 scripts/stage-release.py "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/unsigned" "$RUNNER_TEMP/signed"
      - name: Sign and verify each archive
        env:
          ATOMICS_RELEASE_SIGNING_KEY: ${{ secrets.ATOMICS_RELEASE_SIGNING_KEY }}
        run: |
          for checksum in "$RUNNER_TEMP"/signed/*.sha256; do
            sh scripts/sign-release.sh "${checksum%.sha256}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: atomics-signed-${{ github.run_attempt }}
          retention-days: 14
          compression-level: 0
          path: ${{ runner.temp }}/signed/
          if-no-files-found: error

  release:
    needs: sign
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency: publish-${{ github.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact-id || 'missing' }}
          path: ${{ runner.temp }}/signed
      - name: Publish the signed files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes ''
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/signed/* --clobber
          gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest
