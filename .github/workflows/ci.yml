name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      macos:
        description: Run on macOS instead of Ubuntu
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  check:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.macos && 'macos-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Check the browser crates
        run: |
          cargo check -p atomics-core --target wasm32-unknown-unknown --no-default-features
          cargo check -p atomics-ui -p atomics-web --target wasm32-unknown-unknown
          cargo clippy -p atomics-web --target wasm32-unknown-unknown -- -D warnings
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Check how releases are signed
        if: runner.os == 'Linux'
        run: python3 tests/test_release_signing.py
      - name: Configure git for tests
        run: |
          git config --global user.name 'CI'
          git config --global user.email 'ci@example.com'
      - name: Test
        run: cargo test
